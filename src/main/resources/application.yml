server:
  port: 8080

spring:
  application:
    name: smart-ticket

  # ---------- MySQL 数据源 ----------
  # 注意：password 改成你自己 MySQL 的 root 密码
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # ---------- Redis ----------
  data:
    redis:
      host: localhost
      port: 6379
      # 你的 Redis 没设密码，这里留空
      password:
      database: 0
      timeout: 3000ms

  # 返回 JSON 时的时间格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    # 把数据库的 snake_case 字段名自动映射成 Java 的 camelCase 属性名
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，方便调试（上线要关掉）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- 自定义配置 ----------
# 这些是我们自己代码里读的，不是 Spring 官方的
app:
  jwt:
    # 签名密钥，长度必须 >= 32 个字符，否则 jjwt 会报错
    secret: smart-ticket-jwt-secret-key-2026-please-change-me
    # token 有效期：7 天（单位毫秒）
    expire: 604800000
  # Python AI 服务的地址（第 5-6 周才会用到，先留好）
  ai:
    base-url: http://localhost:8000
    enabled: false

# 日志级别
logging:
  level:
    com.smartticket: debug
